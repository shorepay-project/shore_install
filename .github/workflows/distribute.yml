name: Publish distribution page
run-name: ${{ inputs.release_tag && format('Publish {0}', inputs.release_tag) || '' }}

# Pages 只认 main 上的部署：tag 触发的部署会报成功但页面不更新。
# Release 事件只负责在 main 上触发一次构建、部署和通知。
on:
  push:
    branches: [main]
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 触发本次更新的 Release tag
        type: string
        default: ''
      notify:
        description: 部署后发飞书通知
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shore-install-pages
  cancel-in-progress: false

jobs:
  forward:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          NOTIFY: ${{ github.event.action == 'published' }}
        run: >-
          gh workflow run distribute.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          -f release_tag="$RELEASE_TAG"
          -f notify="$NOTIFY"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Read releases and generate installation files
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-metadata
          path: docs/apps.json
          retention-days: 1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages 固定拿提交号当构建版本号：同一提交再次部署会命中旧部署，
      # 几秒就报成功但页面不换，旧部署还会在不同节点间串。这里每次运行用独有的
      # 版本号直接调用 Pages 部署接口，并等到部署真正完成。
      - name: Deploy Pages
        id: deployment
        uses: actions/github-script@v9
        with:
          script: |
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId,
            });
            const artifact = artifacts.find((item) => item.name === 'github-pages');
            if (!artifact) {
              throw new Error('没有找到 github-pages 产物');
            }
            const version = crypto
              .createHash('sha1')
              .update(`${context.sha}:${context.runId}:${process.env.GITHUB_RUN_ATTEMPT}`)
              .digest('hex');
            const { data: created } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner,
              repo,
              artifact_id: artifact.id,
              pages_build_version: version,
              oidc_token: await core.getIDToken(),
            });
            const id = created.id || created.status_url?.split('/').pop() || version;
            core.info(`部署 ${id}，构建版本 ${version}，产物 ${artifact.id}`);
            const failed = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
            const deadline = Date.now() + 10 * 60 * 1000;
            for (;;) {
              await new Promise((resolve) => setTimeout(resolve, 5000));
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', {
                owner,
                repo,
                id,
              });
              core.info(`状态 ${data.status}`);
              if (data.status === 'succeed') {
                break;
              }
              if (failed.includes(data.status)) {
                throw new Error(`Pages 部署失败：${data.status}`);
              }
              if (Date.now() > deadline) {
                throw new Error('Pages 部署超时');
              }
            }
            core.setOutput('page_url', created.page_url);

  notify:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.notify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: distribution-metadata
          path: docs
      - name: Notify Lark group
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: npm run notify-lark
